<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>形式发票制作</title>
<style>html,body{margin:0;height:100%;background:#f5f5f7;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;color:#6e6e73}
@media (prefers-color-scheme:dark){html,body{background:#000;color:#a1a1a6}}
.w{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;font-size:14px}
.s{width:26px;height:26px;border:3px solid rgba(128,128,128,.25);border-top-color:#0071e3;border-radius:50%;animation:r 1s linear infinite}@keyframes r{to{transform:rotate(360deg)}}
button{font:inherit;border:0;border-radius:980px;padding:8px 18px;background:#0071e3;color:#fff;cursor:pointer}</style></head>
<body><div class="w" id="w"><div class="s"></div><div>正在加载最新版本… / Loading latest version…</div></div>
<script>
/* Fixed entry point: never needs to change. It always fetches the newest app.html, bypassing caches. */
(function load() {
  var url = 'app.html?t=' + Date.now();
  fetch(url, { cache: 'no-store' }).then(function (r) {
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return r.text();
  }).then(function (html) {
    document.open(); document.write(html); document.close();
  }).catch(function (e) {
    document.getElementById('w').innerHTML = '<div>加载失败 / Load failed: ' + (e && e.message || e) + '</div><button id="b">重试 / Retry</button>';
    document.getElementById('b').onclick = function () { document.getElementById('w').innerHTML = '<div class="s"></div>'; load(); };
  });
})();
</script></body></html>
